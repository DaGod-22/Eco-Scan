<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="EcoScan SA">
  <!-- Forest green #1E4620 background with rounded corners — works on light and dark -->
  <rect width="32" height="32" rx="8" fill="#1E4620"/>
  <!-- Cream #F4F4F3 leaf — bold, flat, single shape for 16px legibility -->
  <g fill="#F4F4F3">
    <!-- Main leaf body: teardrop pointing up -->
    <path d="M16 4.5 C 21.5 8.5, 25 14.2, 23.2 19.5 C 21.8 23.2, 19 26, 16 27.5 C 13 26, 10.2 23.2, 8.8 19.5 C 7 14.2, 10.5 8.5, 16 4.5 Z"/>
    <!-- Inner highlight cut to suggest two leaves / recycling loop (negative space) -->
    <path d="M16 9.5 C 19 12.2, 20.5 15, 19.8 17.8 C 19.2 19.8, 17.8 21.5, 16 22.5 C 14.2 21.5, 12.8 19.8, 12.2 17.8 C 11.5 15, 13 12.2, 16 9.5 Z" fill="#1E4620" opacity="0.18"/>
  </g>
  <!-- Vein / stem — subtle green line for depth -->
  <path d="M16 10.5 L16 23" stroke="#1E4620" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <path d="M16 16 C 17.2 15.2, 18.5 14, 19.5 12.5" stroke="#1E4620" stroke-width="0.9" stroke-linecap="round" opacity="0.7" fill="none"/>
  <path d="M16 18 C 14.8 17.2, 13.5 16, 12.5 14.5" stroke="#1E4620" stroke-width="0.9" stroke-linecap="round" opacity="0.7" fill="none"/>
</svg>
